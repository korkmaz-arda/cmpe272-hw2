name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # No GitHub credentials are configured, so integration tests stay
      # deselected and no real issues are ever created by CI.
      - name: Unit tests with coverage
        env:
          GITHUB_TOKEN: ci-placeholder-not-a-real-credential
          GITHUB_OWNER: ci-owner
          GITHUB_REPO: ci-repo
          WEBHOOK_SECRET: ci-placeholder-secret
          PORT: "8000"
        run: pytest --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t cmpe272-hw2 .

      - name: Smoke-test the image
        run: |
          docker run -d --name hw2 -p 8000:8000 \
            -e GITHUB_TOKEN=ci-placeholder-not-a-real-credential \
            -e GITHUB_OWNER=ci-owner \
            -e GITHUB_REPO=ci-repo \
            -e WEBHOOK_SECRET=ci-placeholder-secret \
            -e PORT=8000 \
            cmpe272-hw2
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          echo "Service did not become healthy"; docker logs hw2; exit 1

# Live integration tests are intentionally NOT part of the default pipeline: they
# would need a real fine-grained PAT and would create issues in a real repository.
# To enable them, add GH_ITEST_TOKEN / GH_ITEST_OWNER / GH_ITEST_REPO repository
# secrets and a job that runs:
#
#   pytest -m integration --no-cov
#
# with GITHUB_TOKEN/GITHUB_OWNER/GITHUB_REPO set from those secrets.
